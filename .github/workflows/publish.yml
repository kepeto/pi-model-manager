name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # OIDC — required for npm trusted publishing (no token needed)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: npm publish
